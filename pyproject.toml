[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "au-ree-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["shapely==2.1.2", "pyproj==3.7.2", "pypdf==6.10.0", "openpyxl==3.1.5", "PyMuPDF==1.26.7"]

[project.optional-dependencies]
experiments = ["numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0"]
ontology = ["rdflib==7.6.0", "pyshacl==0.40.2"]

[project.scripts]
au-ree-v2 = "au_ree_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
