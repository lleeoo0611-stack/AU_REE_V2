[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "au-ree-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["shapely==2.1.2", "pyproj==3.7.2", "pypdf==6.10.0", "openpyxl==3.1.5"]

[project.scripts]
au-ree-v2 = "au_ree_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
