name: Research system
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch public updates and retain as run artifact
        type: boolean
        default: false
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install package
        run: python -m pip install .
      - name: Core, clean bootstrap and replay tests
        run: python -m unittest discover -s tests -v
      - name: R analytical regression tests
        run: Rscript tests/test_methods.R
      - name: Frozen research reconstruction
        run: au-ree-v2 all --as-of 2026-11-02 --work work/frozen
      - name: Incremental public update (isolated live-source smoke)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) || (github.event_name == 'push' && github.ref_name == 'feat/reproducible-research-core')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          au-ree-v2 acquire > work/acquisition_status.json
          au-ree-v2 all --work work/updated
      - name: Scan publication payload
        run: python tools/check_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/frozen/runs/
            work/updated/runs/
            work/acquisition_status.json
            data/manifest.json
            data/snapshots/
          retention-days: 90
