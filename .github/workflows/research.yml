name: Research system
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch public updates and retain as run artifact
        type: boolean
        default: false
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install package
        run: python -m pip install .
      - name: Core, clean bootstrap and replay tests
        run: python -m unittest discover -s tests -v
      - name: R analytical regression tests
        run: Rscript tests/test_methods.R
      - name: Frozen research reconstruction
        run: au-ree-v2 all --as-of 2026-11-02 --work work/frozen
      - name: Incremental public update (isolated live-source smoke)
        id: live
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) || (github.event_name == 'push' && github.ref_name == 'feat/reproducible-research-core')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          au-ree-v2 acquire > work/acquisition_status.json
          au-ree-v2 all --work work/updated
          python -m unittest discover -s tests -v
      - name: Stage reproducible Phase 2 research outputs
        if: github.event_name == 'push' && github.ref_name == 'feat/reproducible-research-core'
        run: |
          set -euo pipefail
          run_dir="$(find work/frozen/runs/ -mindepth 1 -maxdepth 1 -type d | sort | head -n 1)"
          test -n "$run_dir"
          dest=results/phase2-2026-11-02
          mkdir -p "$dest"
          cp -r "$run_dir/official_wa_resource_screen" "$dest/"
          for name in snapshot_lock.json configuration.json official_resource_inventory.csv national_prospectus_evidence.csv project_domain_evidence.csv national_e1_candidates.csv national_e1_coverage.csv national_e1_port_distances.csv deposit_port_distances.csv aim_c_deposit_type_port_summary.csv; do
            cp "$run_dir/$name" "$dest/$name"
          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          folder = Path('results/phase2-2026-11-02')
          paths = sorted(p for p in folder.rglob('*') if p.is_file() and p.name != 'provenance.json')
          hashes = {p.relative_to(folder).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          manifest = {'analysis_cutoff':'2026-11-02',
                      'cohort':'20 source-published WA summary projects; NOT JORC harmonized or six-domain eligibility',
                      'national_source_selection':'339 legacy screened records, NOT 339 independent projects',
                      'evidence_warning':'Rounding variability is not measurement uncertainty; ranking frequency is not success probability',
                      'files':hashes}
          (folder / 'provenance.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Staged Phase 2 scientific output files:',len(paths))
          PY
      - name: Scan publication payload
        run: python tools/check_publication.py
      - name: Archive verified public snapshot bytes to research branch
        if: github.event_name == 'push' && github.ref_name == 'feat/reproducible-research-core' && steps.live.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp work/acquisition_status.json data/acquisition_status_latest.json
          git add data/manifest.json data/snapshots/ data/acquisition_status_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: freeze public source acquisition snapshots [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Publish verified Phase 2 scientific outputs to research branch
        if: github.event_name == 'push' && github.ref_name == 'feat/reproducible-research-core'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/phase2-2026-11-02
          if ! git diff --cached --quiet; then
            git commit -m "results: freeze national E1 coverage and WA 20-project MCDA [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/frozen/runs/
            work/updated/runs/
            work/acquisition_status.json
            data/manifest.json
            data/snapshots/
          retention-days: 90
