name: Research system
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: PR validation or complete research archive validation
        type: choice
        options: [pr, archive]
        default: archive
      refresh:
        description: Fetch public updates and retain as run artifact
        type: boolean
        default: false
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change_scope:
    runs-on: ubuntu-latest
    outputs:
      run_pipeline: ${{ steps.changed.outputs.run_pipeline }}
      integration: ${{ steps.tiers.outputs.integration }}
      full: ${{ steps.tiers.outputs.full }}
      phase10: ${{ steps.tiers.outputs.phase10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the update contains only publication receipts
        id: changed
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
          EVENT_KIND: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          before=os.environ.get('PREVIOUS_HEAD','')
          receipts_only=False
          if os.environ['EVENT_KIND']=='pull_request' and os.environ['EVENT_ACTION']=='synchronize' and re.fullmatch(r'[0-9a-fA-F]{40}',before):
              try:
                  raw=subprocess.check_output(['git','diff','--name-only','-z',before,'HEAD'])
                  changed=[p for p in raw.decode('utf8').split('\0') if p]
                  receipts_only=bool(changed) and all(p.startswith(('results/integrated-rebuild-2026-11-15/','results/same-sha-fallback-2026-11-16/')) for p in changed)
              except subprocess.CalledProcessError:
                  pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run_pipeline='+str(not receipts_only).lower()+'\n')
          print({'verified_receipts_only':receipts_only,'run_full_pipeline':not receipts_only})
          PY
      - name: Route affected validation tiers
        id: tiers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/phase10_ci.py route --base "$BASE_SHA" --receipt work/ci-routing.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}
          path: work/ci-routing.json
  fast:
    name: Fast Python and static checks
    needs: change_scope
    if: needs.change_scope.outputs.run_pipeline == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-constraints.txt
      - run: python -m pip install -c requirements-constraints.txt '.[experiments,ontology]'
      - name: Verify the diff and run affected unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE_SHA" && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD
          fi
          python tools/phase10_ci.py test --base "$BASE_SHA"
  integration:
    name: PDF, evidence, SQLite and R integration
    needs: change_scope
    if: needs.change_scope.outputs.run_pipeline == 'true' && needs.change_scope.outputs.integration == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-constraints.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - run: python -m pip install -c requirements-constraints.txt '.[experiments,ontology]'
      - name: Source to canonical resource selection and MCDA
        run: python tests/test_resource_admission_integration.py --output work/resource-admission-engineering
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-integration-${{ github.run_id }}
          path: |
            work/resource-admission-engineering/engineering_proof.json
            work/resource-admission-engineering/retrieval-differences/*.json
          if-no-files-found: error
  phase10_sources:
    name: Frozen Phase 10 evidence and exact originals
    needs: change_scope
    if: needs.change_scope.outputs.run_pipeline == 'true' && needs.change_scope.outputs.phase10 == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-constraints.txt
      - run: python -m pip install -c requirements-constraints.txt .
      - name: Replay automatically frozen holdout
        run: python -m tools.run_phase10 --mode quality --out work/phase10-holdout --work work/phase10-audit --fetch-holdout
      - name: Preserve the exact recovered public PDFs
        if: always()
        run: |
          python -m au_ree_v2.phase10_recovery \
            --reacquire-archive-manifest results/phase10-2026-11-27/source_recovery_manifest.json \
            --out work/phase10-original-batch --request-budget 80 --timeout 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-verified-originals-${{ github.run_id }}
          path: |
            work/phase10-original-batch/assets
            work/phase10-original-batch/reacquire_receipt.json
            work/phase10-audit/holdout-originals/assets
            work/phase10-audit/holdout-originals/holdout_reacquisition.json
            work/phase10-holdout
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-recovery-receipts-${{ github.run_id }}
          path: |
            work/phase10-original-batch/reacquire_receipt.json
            work/phase10-audit/holdout-originals/holdout_reacquisition.json
            work/phase10-holdout/quality_holdout/quality_measurement.json
          if-no-files-found: warn
  research:
    needs: [change_scope, fast, integration]
    if: needs.change_scope.outputs.run_pipeline == 'true' && needs.change_scope.outputs.full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh))
    runs-on: ubuntu-latest
    # Includes both historical and current policy runs on the same lock.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARCHIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'archive' }}
        run: |
          python - <<'PY'
          import os, subprocess
          base=os.environ.get('BASE_SHA') or 'HEAD^'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          core=any(p.startswith(('src/','R/','config/')) for p in changed)
          archive=core or os.environ.get('ARCHIVE')=='true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('history='+str(core or archive).lower()+'\n')
              f.write('archive='+str(archive).lower()+'\n')
          print({'core_contract_change':core,'full_history':core or archive,'archive_two_clean':archive})
          PY
      - name: Verify declared pre-cutoff repository evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_pre_cutoff_evidence.py --events-file config/pre_cutoff_evidence_events.json
      - name: Warn about invalid or missing pre-cutoff proof
        if: always()
        run: python tools/verify_pre_cutoff_evidence.py --warn-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install package
        run: python -m pip install -c requirements-constraints.txt '.[experiments,ontology]'
      - name: Core, clean bootstrap and replay tests
        run: python -m unittest discover -s tests -v
      - name: R analytical regression tests
        run: Rscript tests/test_methods.R
      - uses: actions/download-artifact@v4
        with:
          name: phase10-integration-${{ github.run_id }}
          path: work/resource-admission-engineering
      - name: Frozen research reconstruction
        run: au-ree-v2 all --as-of 2026-11-02 --work work/frozen
      - name: Frozen Phase 5 evidence reconstruction
        if: steps.scope.outputs.history == 'true'
        run: au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase5-2026-11-03/snapshot_lock.json --compare-to results/phase4-2026-11-03 --work work/primary
      - name: Phase 6 national database and partial MCDA reconstruction
        if: steps.scope.outputs.history == 'true'
        run: au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase6-2026-11-03/snapshot_lock.json --compare-to results/phase5-2026-11-03 --work work/national
      - name: Verify frozen Phase 5 and Phase 6 scientific results
        if: steps.scope.outputs.history == 'true'
        run: |
          python tools/check_replay.py results/phase5-2026-11-03 work/primary/latest.json
          python tools/check_replay.py results/phase6-2026-11-03 work/national/latest.json
      - name: Phase 7 consolidated evidence and commercial integration
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase7-2026-11-03/snapshot_lock.json --compare-to results/phase6-2026-11-03 --work work/consolidated
          python tools/check_replay.py results/phase7-2026-11-03 work/consolidated/latest.json
      - name: Phase 8 coverage and comparable endpoint reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase8-2026-11-03/snapshot_lock.json --compare-to results/phase7-2026-11-03 --work work/coverage
          python tools/check_replay.py results/phase8-2026-11-03 work/coverage/latest.json
      - name: Phase 9 automatic document evidence reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase9-2026-11-03/snapshot_lock.json --compare-to results/phase8-2026-11-03 --work work/documents
          python tools/check_replay.py results/phase9-2026-11-03 work/documents/latest.json
          python tools/evaluate_documents.py work/document_benchmark.json --phase9
          python -c "import json; assert json.load(open('work/document_benchmark.json')) == json.load(open('data/phase9_document_benchmark.json'))"
      - name: Phase 10 shared technical comparability reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase10-2026-11-03/snapshot_lock.json --compare-to results/phase9-2026-11-03 --work work/technical
          python tools/check_replay.py results/phase10-2026-11-03 work/technical/latest.json
          python tools/evaluate_documents.py work/technical_benchmark.json
          python -c "import json; assert json.load(open('work/technical_benchmark.json')) == json.load(open('data/phase10_document_benchmark.json'))"
          python -c "import json,pathlib; p=pathlib.Path(json.load(open('work/technical/latest.json'))['output_dir']); assert (p/'technical_comparability.csv').read_bytes()==pathlib.Path('results/phase10-2026-11-03/technical_comparability.csv').read_bytes()"
      - name: Phase 11 deterministic frozen reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase11-2026-11-04/snapshot_lock.json --work work/deterministic-a
          python tools/check_replay.py results/phase10-2026-11-03 work/deterministic-a/latest.json
          python tools/check_phase11.py results/phase11-2026-11-04 work/deterministic-a/latest.json --reference
      - name: Phase 12 evidence yield and deterministic research reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase12-2026-11-04/snapshot_lock.json --compare-to results/phase11-2026-11-04 --work work/evidence-yield-a
          python tools/check_phase11.py results/phase12-2026-11-04 work/evidence-yield-a/latest.json --reference
          python tools/evaluate_documents.py work/phase12_document_benchmark.json --phase12
          python -c "import json; assert json.load(open('work/phase12_document_benchmark.json')) == json.load(open('data/phase12_document_benchmark.json'))"
      - name: Phase 13 source recovery frozen reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase13-2026-11-04/snapshot_lock.json --compare-to results/phase12-2026-11-04 --work work/source-recovery-a
          python tools/check_phase11.py results/phase13-2026-11-04 work/source-recovery-a/latest.json --reference
          python tools/evaluate_documents.py work/phase13_document_benchmark.json --phase13
          python -c "import json; assert json.load(open('work/phase13_document_benchmark.json')) == json.load(open('data/phase13_document_benchmark.json'))"
      - name: Phase 14 official report frozen reconstruction
        if: steps.scope.outputs.history == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase14-2026-11-04/snapshot_lock.json --work work/official-reports-a
          python tools/check_phase11.py results/phase14-2026-11-04 work/official-reports-a/latest.json --reference
          python tools/evaluate_documents.py work/phase14_document_benchmark.json --phase14
          python -c "import json; assert json.load(open('work/phase14_document_benchmark.json')) == json.load(open('data/phase14_document_benchmark.json'))"
      - name: Phase 15 source-bound technical reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase15-2026-11-04/snapshot_lock.json --work work/technical-evidence-a
          python tools/check_phase15.py results/phase15-2026-11-04 work/technical-evidence-a/latest.json --reference
          python tools/evaluate_technical.py work/technical_benchmark.json
          python -c "import json; assert json.load(open('work/technical_benchmark.json')) == json.load(open('data/phase15_document_benchmark.json'))"
      - name: Phase 16 unified technical model and source batch reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-03 --snapshot-lock results/phase16-2026-11-04/snapshot_lock.json --work work/phase16-a
          python tools/check_phase16.py results/phase16-2026-11-04 work/phase16-a/latest.json --reference
          python tools/evaluate_phase16.py work/phase16_evaluation.json
          python -c "import json; assert json.load(open('work/phase16_evaluation.json')) == json.load(open('data/phase16_evaluation.json'))"
      - name: Phase 16 remediation source, semantic and process-panel reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase16-remediation-2026-11-05/snapshot_lock.json --work work/phase16-remediation-a
          python tools/check_phase16_remediation.py results/phase16-remediation-2026-11-05 work/phase16-remediation-a/latest.json --reference
          python tools/evaluate_phase16_remediation.py work/phase16_remediation_evaluation.json
          python -c "import json; assert json.load(open('work/phase16_remediation_evaluation.json')) == json.load(open('data/phase16_remediation_evaluation.json'))"
      - name: Independent current release reconstruction
        if: steps.scope.outputs.archive == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase16-remediation-2026-11-05/snapshot_lock.json --work work/phase16-remediation-b
          python tools/check_phase16_remediation.py work/phase16-remediation-a/latest.json work/phase16-remediation-b/latest.json
      - name: Phase 20 current six-domain disclosure reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase20-2026-11-05/snapshot_lock.json --work work/phase20
          python tools/check_replay.py results/phase20-2026-11-05 work/phase20/latest.json
      # Current release checks are distinct from frozen-history compatibility.
      - name: Phase 21 current source, registry and disclosure reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase21-2026-11-05/snapshot_lock.json --work work/phase21-a
          python tools/check_replay.py results/phase21-2026-11-05 work/phase21-a/latest.json
      - name: Phase 21 independent clean reconstruction
        if: steps.scope.outputs.archive == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase21-2026-11-05/snapshot_lock.json --work work/phase21-b
          python tools/check_replay.py results/phase21-2026-11-05 work/phase21-b/latest.json
      - name: Phase 22 current evidence and shared-method reconstruction
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json --work work/phase22-a
          python tools/check_replay.py results/phase22-2026-11-06 work/phase22-a/latest.json
      - name: Reproduce and repair JORC PDF proposition cases
        run: |
          baseline=$(mktemp -d)
          git archive 1c0a3a2b586333d82417924c884d59d6ef022c61 src | tar -x -C "$baseline"
          mkdir -p work/resource-admission-delta
          PYTHONPATH="$baseline/src" python tests/test_resource_admission_review_pdf.py --proposition-receipt work/resource-admission-delta/jorc-before.json
          PYTHONPATH=src python tests/test_resource_admission_review_pdf.py --proposition-receipt work/resource-admission-delta/jorc-after.json
      - name: Replay the same two estimate-scope PDF originals
        run: |
          baseline=$(mktemp -d)
          git archive e75a822c54f86682a3175f1d27cf85912c7479d9 src | tar -x -C "$baseline"
          outputs=work/resource-admission-delta
          python tests/test_resource_admission_review_pdf.py --prepare-scope-replay "$outputs/scope-originals"
          inputs="$outputs/scope-originals/scope-fixtures.json"
          PYTHONPATH="$baseline/src" python tests/test_resource_admission_review_pdf.py --scope-replay "$inputs" "$outputs/scope-before.json"
          PYTHONPATH=src python tests/test_resource_admission_review_pdf.py --scope-replay "$inputs" "$outputs/scope-after.json"
          PYTHONPATH=src python tests/test_resource_admission_review_pdf.py --scope-replay "$inputs" "$outputs/scope-after-with-history.json" "$outputs/scope-before.json"
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('work/resource-admission-delta')
          prior, fixed = (json.loads((base / f'scope-{tag}.json').read_text())['cases'] for tag in ('before', 'after'))
          history = json.loads((base / 'scope-after-with-history.json').read_text())['cases']
          assert len(prior) == 2 and prior.keys() == fixed.keys()
          for name, expected in prior.items():
              actual = fixed[name]
              assert expected['source_sha256'] == actual['source_sha256'] and actual['source_check']['sha_verified']
              assert expected['new_canonical_observations'] == 3 and expected['selected_resource']['contained_treo_kt'] == 100
              assert actual['new_canonical_observations'] == 0 and actual['selected_resource'] is None
              assert history[name]['canonical_observations'] == expected['canonical_observations']
              assert not history[name]['active_admission_observation_ids']
              assert history[name]['selected_resource'] is None and history[name]['new_canonical_observations'] == 0
          PY
      - name: Compare the historical cohort with current analysis without approval files
        run: |
          common=(--as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json
                  --mcda-weight-calculation ordered-domain-fsum-v2 --mcda-trace-panel issuer_resource_composition)
          PYTHONHASHSEED=17 au-ree-v2 rebuild "${common[@]}" --c1-cohort-policy historical --work work/resource-admission-c1-historical
          hidden=$(mktemp -d)
          approvals=(config/eligibility_compatibility.json config/formal_c1_review.json)
          restore() {
            for approval in "${approvals[@]}"; do
              if test -f "$hidden/${approval##*/}"; then mv "$hidden/${approval##*/}" "$approval"; fi
            done
          }
          trap restore EXIT
          for approval in "${approvals[@]}"; do mv "$approval" "$hidden/"; done
          PYTHONHASHSEED=17 au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-current-baseline
          python - <<'PY'
          import json
          from pathlib import Path
          from au_ree_v2.formal_resource_refresh import compare
          def run(folder):
              return Path(json.loads((Path('work') / folder / 'latest.json').read_text())['output_dir'])
          historic, current = (run('resource-admission-' + name) for name in ('c1-historical', 'current-baseline'))
          lock = json.loads((current / 'configuration.json').read_text())
          assert lock['research']['c1_cohort_policy']['status'] == 'DISABLED'
          assert 'eligibility_policy_sha256' not in lock
          result = compare(historic, current, 'work/resource-admission-delta/c1-policy', mode='policy_effect')
          assert result['comparison']['changed_factors'] == ['c1_cohort_policy']
          assert not result['formal_c1']['required_gates'] and not result['new_canonical_observations']
          assert all(not any(panel[key] for key in ('cohort_added', 'cohort_removed', 'matrix_differences',
                                                    'ranking_differences')) for panel in result['panels'].values())
          assert any('C1' in panel['criteria'] and panel['updated_r_status'] == 'COMPLETED'
                     for panel in result['panels'].values())
          PY
      - name: Verify reported TREO reaches existing MCDA from the locked PDF
        run: |
          common=(--as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json
                  --mcda-weight-calculation ordered-domain-fsum-v2 --mcda-trace-panel issuer_resource_composition)
          frame=config/ontology/resource_admission_frame_v1.json
          au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-fixed --resource-admission config/ontology/quality_frame_v1.json
          PYTHONHASHSEED=29 au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-replay --resource-admission "$frame"
          PYTHONHASHSEED=83 au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-repeat --resource-admission "$frame" --mcda-cache-mode off
          python tools/check_replay.py --hash-seed-replay work/resource-admission-replay/latest.json work/resource-admission-repeat/latest.json 29 83 work/resource-admission-delta/hash-seed-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          from au_ree_v2.formal_resource_refresh import compare
          def run(folder):
              return json.loads((Path(folder) / 'latest.json').read_bytes())['output_dir']
          baseline = run('work/resource-admission-current-baseline')
          fixed = compare(baseline, run('work/resource-admission-fixed'), 'work/resource-admission-delta/fixed',
                          mode='admission_effect')
          assert not fixed['comparison']['source_editions_changed']
          delta = compare(baseline, run('work/resource-admission-replay'), 'work/resource-admission-delta',
                          mode='admission_effect', include_uncertainty=True)
          assert delta['active_admission_ids_in_selected_inputs']
          panel = delta['panels']['issuer_resource_composition']
          assert panel['matrix_primary_criterion_cells_changed'] and panel['updated_r_status'] == 'COMPLETED'
          assert panel['rank_uncertainty']['draw_pairing']['status'] == 'PAIRED_VERIFIED_DRAW_RANKS'
          PY
      - name: Compare locked fixed and full-text resource retrieval
        run: |
          common=(--as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json
                  --mcda-weight-calculation ordered-domain-fsum-v2 --mcda-trace-panel issuer_resource_composition
                  --resource-retrieval full-text)
          au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-fixed-fulltext --resource-admission config/ontology/quality_frame_v1.json
          au-ree-v2 rebuild "${common[@]}" --work work/resource-admission-fulltext --resource-admission config/ontology/resource_admission_frame_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          from au_ree_v2.formal_resource_refresh import compare
          def run(folder):
              return json.loads((Path(folder) / 'latest.json').read_bytes())['output_dir']
          pairs = [('fixed', 'resource-admission-fixed', 'resource-admission-fixed-fulltext'),
                   ('supplement', 'resource-admission-replay', 'resource-admission-fulltext')]
          for name, fixed, retrieved in pairs:
              result = compare(run('work/' + fixed), run('work/' + retrieved),
                               'work/resource-admission-delta/retrieval/' + name, mode='retrieval_effect',
                               include_uncertainty=True)
              scope = result['comparison']['retrieval_scope']['updated']
              assert scope['policy']['mode'] == 'full-text' and scope['effective_frame_sources']
              assert result['comparison']['changed_factors'] == ['admission_retrieval']
          PY
      - name: Validate the eight frozen source editions and selected page roles
        run: |
          au-ree-v2 rebuild --as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json \
            --mcda-weight-calculation ordered-domain-fsum-v2 --mcda-trace-panel issuer_resource_composition \
            --resource-retrieval full-text --resource-admission config/ontology/resource_admission_round9_frame_v1.json \
            --work work/resource-admission-validation-frame
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('work/resource-admission-validation-frame/latest.json').read_text())
          receipt = json.loads((Path(latest['output_dir']) / 'resource_admission.json').read_text())
          plan = receipt['frame_validation']['sources']
          actual = {row['source_key']: row for row in receipt['effective_frame_sources']}
          assert len(actual) == receipt['counts']['sources_sha_verified'] == len(plan) == 8
          assert sum(row['role'] == 'DEVELOPMENT_REGRESSION' for row in plan.values()) == 2
          for key, fields in plan.items():
              assert actual[key]['pages'] == fields['expected_value_pages']
              assert actual[key]['context_pages'] == fields['expected_context_pages']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-admission-review-${{ github.run_id }}
          path: |
            work/resource-admission-engineering/engineering_proof.json
            work/resource-admission-engineering/retrieval-differences/*.json
            work/resource-admission-fixed/runs/*/resource_admission.json
            work/resource-admission-fixed-fulltext/runs/*/resource_admission.json
            work/resource-admission-replay/runs/*/resource_admission.json
            work/resource-admission-fulltext/runs/*/resource_admission.json
            work/resource-admission-validation-frame/runs/*/resource_admission.json
            work/resource-admission-delta/scope-originals/**/*.pdf
            work/resource-admission-delta/**/*.json
          if-no-files-found: warn
      - name: Phase 22 second clean reconstruction
        if: steps.scope.outputs.archive == 'true'
        run: |
          au-ree-v2 rebuild --c1-cohort-policy historical --as-of 2026-11-05 --snapshot-lock results/phase22-2026-11-06/snapshot_lock.json --work work/phase22-b
          python tools/check_replay.py results/phase22-2026-11-06 work/phase22-b/latest.json
      - name: Final publication payload verification
        run: python tools/check_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/pre_cutoff_evidence_verified.json
            work/pre_cutoff_evidence_events.json
            work/resource-admission-engineering/
            work/resource-admission-replay/runs/*/resource_admission.json
            work/resource-admission-delta/
            work/phase22-a/runs/
            work/phase22-b/runs/
            work/phase21-a/runs/
            work/phase21-b/runs/
            work/frozen/runs/
            work/primary/runs/
            work/national/runs/
            work/consolidated/runs/
            work/coverage/runs/
            work/documents/runs/
            work/document_benchmark.json
            work/technical/runs/
            work/technical_benchmark.json
            work/deterministic-a/runs/
            work/evidence-yield-a/runs/
            work/phase12_document_benchmark.json
            work/source-recovery-a/runs/
            work/phase13_document_benchmark.json
            work/official-reports-a/runs/
            work/phase14_document_benchmark.json
            work/technical-evidence-a/runs/
            work/phase16-a/runs/
            work/phase16-remediation-a/runs/
            work/phase16-remediation-b/runs/
            work/phase20/runs/
            work/phase16_remediation_evaluation.json
            work/phase16_evaluation.json
            work/updated/runs/
            work/acquisition_status.json
            data/manifest.json
            data/snapshots/
          retention-days: 90

  live_update:
    name: Live census acquisition and ranking
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    uses: ./.github/workflows/automated-build.yml
