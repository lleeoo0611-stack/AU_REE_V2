name: Prototype input export
on:
  push:
    branches: [feat/expected-results-prototype-20261106]
    paths: [.github/workflows/prototype-input-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5e2a73438e2f3aa9f4adc3ab0f6ff0f898f0fca
          fetch-depth: 1
          sparse-checkout: |
            results/phase22-2026-11-06
            R
            config
            src
            data/claims.json
            data/identity_links.json
            data/manifest.json
          sparse-checkout-cone-mode: false
      - name: Export frozen inputs without rebuilding or modifying science
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, zipfile
          base = Path('.')
          roots = ['results/phase22-2026-11-06', 'R', 'config', 'src']
          files = [p for root in roots for p in Path(root).rglob('*') if p.is_file()]
          files += [Path(p) for p in ['data/claims.json','data/identity_links.json','data/manifest.json'] if Path(p).is_file()]
          files = sorted(set(files))
          manifest = {'base_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'purpose':'Read-only expected-results prototype inputs; formal C1 remains unchanged', 'files': []}
          with zipfile.ZipFile('phase22-prototype-inputs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in files:
                  raw=p.read_bytes()
                  manifest['files'].append({'path':p.as_posix(),'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                  z.writestr(p.as_posix(),raw)
              z.writestr('prototype_input_manifest.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Files:',len(files),'Archive bytes:',Path('phase22-prototype-inputs.zip').stat().st_size)
          assert manifest['base_commit']=='b5e2a73438e2f3aa9f4adc3ab0f6ff0f898f0fca'
          assert Path('phase22-prototype-inputs.zip').stat().st_size < 400_000_000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase22-prototype-inputs
          path: phase22-prototype-inputs.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
